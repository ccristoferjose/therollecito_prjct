#
# OPT-IN LOCAL DEV OVERLAY — Next.js frontend.
#
# frontend-next is deliberately NOT in docker-compose.yml: it is the upcoming
# rewrite, not production, and should not start with the default stack. Bring it
# up explicitly only when you want to work on it:
#
#   docker compose -f docker-compose.yml -f docker-compose.next.yml up --build
#
# The --build matters after a dependency change (e.g. the Next 15 -> 16 upgrade):
# node_modules lives in the image, not a bind mount, so without a rebuild the
# container keeps running the old version.
#
# Visit http://localhost:3000 (the Vite app stays on http://localhost:5173).
#
services:
  frontend-next:
    build: ./frontend-next
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source for HMR; keep the image's node_modules + .next intact.
      - ./frontend-next/src:/app/src
      - ./frontend-next/public:/app/public
      - ./frontend-next/next.config.ts:/app/next.config.ts
      - ./frontend-next/.env.local:/app/.env.local:ro
    environment:
      # Next server -> backend over the compose network (SSR + /api rewrite).
      BACKEND_ORIGIN: http://backend:3001
      # Browser uses the relative /api proxy; sockets hit the published port.
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      # File-watch polling for HMR inside the container bind-mount.
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
