#
# LOCAL DEVELOPMENT ONLY
#
# This stack intentionally includes MySQL, MinIO, bind mounts, and dev servers.
# Do not deploy this file to production. Production must use either:
#   - deploy/lightsail-backend.sh for AWS Lightsail Container Service, or
#   - docker-compose.prod.yml for a manually managed server.
#
services:
  # ---------------------------------------------------------------------------
  # MySQL 8.x
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      # Restaurant timezone. Override with `TZ=America/...` in your shell or .env.
      # MUST match the backend service so absolute timestamps (NOW(), CURDATE(),
      # CURTIME()) align with the user's clock and the admin-set service hours.
      TZ: ${TZ:-America/Los_Angeles}
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: restaurant_ordering
    ports:
      # Published on 3307 to avoid colliding with a native MySQL on the host's
      # 3306. The backend reaches this DB as db:3306 over the compose network,
      # so the internal port is unchanged; 3307 is only for host tools.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # SQL files mounted to /sql/ (NOT initdb.d — to avoid double execution).
      # The init.sh script runs them in order via the mysql client,
      # which properly handles DELIMITER for stored procedures.
      - ./backend/database/schema.sql:/sql/01-schema.sql:ro
      - ./backend/database/stored_procedures.sql:/sql/02-stored_procedures.sql:ro
      - ./backend/database/seed.sql:/sql/03-seed.sql:ro
      - ./backend/database/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Local S3 — S3-compatible object storage for LOCAL DEV ONLY.
  # Stands in for AWS S3 so image uploads never touch a real AWS account.
  #
  # Runs RustFS (Apache-2.0, MinIO-compatible API). MinIO stopped publishing
  # its community images: minio/minio and minio/mc no longer exist on Docker
  # Hub or quay.io, so `docker compose up` failed with "pull access denied".
  # The service keeps the name `minio`, the ports and the minioadmin
  # credentials, so backend/.env, S3_ENDPOINT=http://minio:9000 and the Next
  # image config need no changes.
  #   :9000 = S3 API (the backend talks to this)
  #   :9001 = web console (http://localhost:9001, login minioadmin/minioadmin)
  #
  # Images pinned to exact versions so an upstream registry change cannot
  # break local dev again without a visible diff.
  # ---------------------------------------------------------------------------
  minio:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # New volume: the old `minio_data` volume is in MinIO's on-disk format.
      # It is left in place (not deleted); re-upload dev images from the admin.
      - s3_data:/data

  # ---------------------------------------------------------------------------
  # One-shot: wait for the S3 server, create the dev bucket, make its objects
  # publicly readable. Anonymous reads are required because uploaded images
  # are served straight to the browser via <img src> (the app sets no
  # per-object ACL). Anonymous writes and bucket listing stay denied.
  # Exits 0 once done; safe to re-run (idempotent).
  # ---------------------------------------------------------------------------
  minio-setup:
    image: amazon/aws-cli:2.37.3
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S3="aws --endpoint-url http://minio:9000"
        until $$S3 s3api list-buckets >/dev/null 2>&1; do
          echo 'waiting for local S3...'; sleep 1
        done
        $$S3 s3api head-bucket --bucket the-rollecito-dev 2>/dev/null \
          || $$S3 s3api create-bucket --bucket the-rollecito-dev
        $$S3 s3api put-bucket-policy --bucket the-rollecito-dev --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::the-rollecito-dev/*"]}]}'
        echo 'Local S3 bucket the-rollecito-dev ready (public read).'

  # ---------------------------------------------------------------------------
  # Backend (Node.js + Express)
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend/.env:/app/.env:ro
      # Firebase Admin SDK credentials — referenced by GOOGLE_APPLICATION_CREDENTIALS
      # in backend/.env. Read-only mount; the file is gitignored at the project root.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      # Dev: bind-mount source so nodemon picks up file changes without a rebuild.
      - ./backend/src:/app/src
      - ./backend/database:/app/database:ro
    environment:
      # Restaurant timezone — must match the db service. Drives Node's `new Date()`
      # output and is forwarded to mysql2 so DATETIME literals are parsed
      # consistently. Override via shell env: `TZ=America/Tijuana docker compose up`.
      TZ: ${TZ:-America/Los_Angeles}
      # DB connection (Docker-specific — overrides .env)
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: admin123
      DB_NAME: restaurant_ordering
      DB_CONNECTION_LIMIT: 10
      # The Next app's origin. Only Socket.IO checks it: /api calls reach the
      # backend server-to-server through the Next proxy.
      CORS_ORIGIN: http://localhost:3000
      # S3 → local MinIO. Inside the compose network MinIO is reachable as
      # `minio`, so override the .env value (which uses localhost for
      # bare-metal dev). S3_PUBLIC_URL_BASE stays localhost (from .env) so the
      # browser can load images via the published :9000 port.
      S3_ENDPOINT: http://minio:9000
      # Everything else (PORT, NODE_ENV, JWT, Firebase, Stripe, AWS_* creds,
      # S3_BUCKET, S3_PUBLIC_URL_BASE) is loaded from backend/.env mounted above.
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Frontend (Next.js dev server) — frontend-next/, the production app.
  # Hot-reloads from the host bind-mount. Visit http://localhost:3000.
  #
  # The browser calls a relative /api, which the Next server proxies to the
  # backend over the compose network (BACKEND_ORIGIN, rewrite in
  # next.config.ts). Socket.IO cannot go through that rewrite, so the browser
  # connects straight to the backend's published port.
  #
  # The legacy Vite app (frontend/) is no longer started here. Run it
  # directly with `npm run dev` in frontend/ if you ever need it.
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend-next
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source only, for HMR. node_modules and .next stay inside
      # the image so its linux native binaries are never replaced by the
      # host's macOS ones. After a package.json change: `docker compose up --build`.
      - ./frontend-next/src:/app/src
      - ./frontend-next/public:/app/public
      - ./frontend-next/next.config.ts:/app/next.config.ts
      # .env*.local is .dockerignored, so it is never baked into the image.
      # Holds the NEXT_PUBLIC_FIREBASE_* web config (copy .env.example).
      - ./frontend-next/.env.local:/app/.env.local:ro
    environment:
      # Server side: SSR fetches and the /api rewrite reach the backend here.
      BACKEND_ORIGIN: http://backend:3001
      # Browser side: relative /api (proxied above); sockets hit the host port.
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # File-watch polling so HMR sees edits through the bind mount.
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend

volumes:
  mysql_data:
  s3_data:
